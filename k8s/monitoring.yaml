apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "loki-config"
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "grafana-datasources"
data:
  datasources.yml: |
    apiVersion: 1
    prune: true
    # Remove a fonte antiga de volumes que ja tinham essa configuracao.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
      - name: Zipkin
        uid: zipkin
        type: zipkin
        access: proxy
        url: http://zipkin:9411
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "grafana-provider"
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Passagens
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "grafana-dashboard"
data:
  passagens.json: |
    {
      "uid": "passagens",
      "title": "Sistema de passagens",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 5,
          "title": "Logs dos microsservicos",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 18,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "{job=\"microsservicos\"} | json",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "zipkin"
spec:
  selector:
    app: "zipkin"
  ports:
    -
      name: "http"
      port: 9411
      targetPort: 9411
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "zipkin"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "zipkin"
  template:
    metadata:
      labels:
        app: "zipkin"
    spec:
      containers:
        -
          name: "zipkin"
          image: "openzipkin/zipkin:3.5"
          ports:
            -
              containerPort: 9411
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 9411
            initialDelaySeconds: 10
          volumeMounts: []
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "loki"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "loki"
spec:
  selector:
    app: "loki"
  ports:
    -
      name: "http"
      port: 3100
      targetPort: 3100
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "loki"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "loki"
  template:
    metadata:
      labels:
        app: "loki"
    spec:
      containers:
        -
          name: "loki"
          image: "grafana/loki:3.5.0"
          ports:
            -
              containerPort: 3100
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
          volumeMounts:
            -
              name: "loki-config"
              mountPath: "/etc/loki"
            -
              name: "data"
              mountPath: "/loki"
          args:
            - "-config.file=/etc/loki/local-config.yaml"
      volumes:
        -
          name: "loki-config"
          configMap:
            name: "loki-config"
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "loki"
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
  strategy:
    type: "Recreate"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "grafana"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "grafana"
spec:
  selector:
    app: "grafana"
  ports:
    -
      name: "http"
      port: 3000
      targetPort: 3000
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "grafana"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "grafana"
  template:
    metadata:
      labels:
        app: "grafana"
    spec:
      containers:
        -
          name: "grafana"
          image: "grafana/grafana:12.0.0"
          ports:
            -
              containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
          volumeMounts:
            -
              name: "grafana-datasources"
              mountPath: "/etc/grafana/provisioning/datasources"
            -
              name: "grafana-provider"
              mountPath: "/etc/grafana/provisioning/dashboards"
            -
              name: "grafana-dashboard"
              mountPath: "/var/lib/grafana/dashboards"
            -
              name: "data"
              mountPath: "/var/lib/grafana"
          env:
            -
              name: "GF_SECURITY_ADMIN_USER"
              value: "admin"
            -
              name: "GF_SECURITY_ADMIN_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "app-secrets"
                  key: "GRAFANA_PASSWORD"
            -
              name: "GF_USERS_ALLOW_SIGN_UP"
              value: "false"
      volumes:
        -
          name: "grafana-datasources"
          configMap:
            name: "grafana-datasources"
        -
          name: "grafana-provider"
          configMap:
            name: "grafana-provider"
        -
          name: "grafana-dashboard"
          configMap:
            name: "grafana-dashboard"
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "grafana"
      securityContext:
        fsGroup: 472
        runAsUser: 472
  strategy:
    type: "Recreate"
