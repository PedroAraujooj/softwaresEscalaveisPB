apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "passageiros-logs"
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 2
        storage.path /state/buffer
    [INPUT]
        Name tail
        Path /logs/*.log
        Tag app
        DB /state/tail.db
        Read_from_Head true
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        storage.type filesystem
    [OUTPUT]
        Name loki
        Match *
        Host loki
        Port 3100
        Labels job=microsservicos,service=passageiros,pod=${POD_NAME}
        Line_Format json
        Drop_Single_Key raw
        Retry_Limit False
        storage.total_limit_size 100M
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "passageiros"
spec:
  selector:
    app: "passageiros"
  ports:
    -
      name: "http"
      port: 8082
      targetPort: 8082
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "passageiros"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "passageiros"
  template:
    metadata:
      labels:
        app: "passageiros"
    spec:
      enableServiceLinks: false
      containers:
        -
          name: "api"
          image: "pb-passageiros:local"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              containerPort: 8082
              name: "http"
          envFrom:
            -
              configMapRef:
                name: "app-config"
          env:
            -
              name: "DB_URL"
              value: "jdbc:postgresql://passageiros-db:5432/passageiros"
            -
              name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "app-secrets"
                  key: "DB_PASSWORD"
            -
              name: "RABBITMQ_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "app-secrets"
                  key: "RABBITMQ_PASSWORD"
            -
              name: "LOGGING_FILE_NAME"
              value: "/logs/passageiros.log"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "logs"
              mountPath: "/logs"
          startupProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: 8082
            timeoutSeconds: 3
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: 8082
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: 8082
            timeoutSeconds: 3
            periodSeconds: 15
        -
          name: "logs"
          image: "fluent/fluent-bit:4.0.0"
          env:
            -
              name: "POD_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.name"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          volumeMounts:
            -
              name: "logs"
              mountPath: "/logs"
            -
              name: "collector-config"
              mountPath: "/fluent-bit/etc"
            -
              name: "collector-state"
              mountPath: "/state"
      volumes:
        -
          name: "logs"
          emptyDir: {}
        -
          name: "collector-state"
          emptyDir: {}
        -
          name: "collector-config"
          configMap:
            name: "passageiros-logs"
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 45
---
