apiVersion: "v1"
kind: "Service"
metadata:
  name: "frontend"
spec:
  selector:
    app: "frontend"
  ports:
    -
      name: "http"
      port: 80
      targetPort: 80
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "frontend"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      enableServiceLinks: false
      containers:
        -
          name: "frontend"
          image: "pb-frontend:local"
          ports:
            -
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: "/"
              port: 80
          livenessProbe:
            httpGet:
              path: "/"
              port: 80
            initialDelaySeconds: 10
