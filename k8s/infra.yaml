apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "passageiros-db"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "passageiros-db"
spec:
  selector:
    app: "passageiros-db"
  ports:
    -
      name: "http"
      port: 5432
      targetPort: 5432
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "passageiros-db"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "passageiros-db"
  template:
    metadata:
      labels:
        app: "passageiros-db"
    spec:
      containers:
        -
          name: "postgres"
          image: "postgres:17-alpine"
          ports:
            -
              containerPort: 5432
          env:
            -
              name: "POSTGRES_DB"
              value: "passageiros"
            -
              name: "POSTGRES_USER"
              value: "app"
            -
              name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "app-secrets"
                  key: "DB_PASSWORD"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql/data"
          readinessProbe:
            exec:
              command:
                - "pg_isready"
                - "-U"
                - "app"
                - "-d"
                - "passageiros"
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "passageiros-db"
  strategy:
    type: "Recreate"
---
