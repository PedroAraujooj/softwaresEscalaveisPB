apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "rabbitmq"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "rabbitmq"
spec:
  selector:
    app: "rabbitmq"
  ports:
    -
      name: "http"
      port: 5672
      targetPort: 5672
    -
      name: "management"
      port: 15672
      targetPort: 15672
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "rabbitmq"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "rabbitmq"
  template:
    metadata:
      labels:
        app: "rabbitmq"
    spec:
      containers:
        -
          name: "rabbitmq"
          image: "rabbitmq:4.1-management"
          env:
            -
              name: "RABBITMQ_DEFAULT_USER"
              value: "app"
            -
              name: "RABBITMQ_DEFAULT_PASS"
              valueFrom:
                secretKeyRef:
                  name: "app-secrets"
                  key: "RABBITMQ_PASSWORD"
            -
              name: "RABBITMQ_NODENAME"
              value: "rabbit@rabbitmq"
          ports:
            -
              containerPort: 5672
            -
              containerPort: 15672
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/rabbitmq"
          readinessProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 15
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "rabbitmq"
      hostname: "rabbitmq"
  strategy:
    type: "Recreate"
