apiVersion: 1
prune: true
# Remove a fonte antiga de volumes que ja tinham essa configuracao.
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
