[SERVICE]
    Flush 2
    Log_Level info
    storage.path /state/buffer
[INPUT]
    Name tail
    Path /logs/passageiros/*.log
    Tag passageiros
    DB /state/passageiros.db
    Read_from_Head true
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    storage.type filesystem
[INPUT]
    Name tail
    Path /logs/passagens/*.log
    Tag passagens
    DB /state/passagens.db
    Read_from_Head true
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    storage.type filesystem
[OUTPUT]
    Name loki
    Match passageiros
    Host loki
    Port 3100
    Labels job=microsservicos,service=passageiros
    Line_Format json
    Drop_Single_Key raw
    Retry_Limit False
    storage.total_limit_size 100M
[OUTPUT]
    Name loki
    Match passagens
    Host loki
    Port 3100
    Labels job=microsservicos,service=passagens
    Line_Format json
    Drop_Single_Key raw
    Retry_Limit False
    storage.total_limit_size 100M
